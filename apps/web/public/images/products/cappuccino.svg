<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EE"/>
      <stop offset="100%" stop-color="#ECD7C1"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EFE6DA"/>
    </linearGradient>
    <linearGradient id="coffeeRimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#542B14"/>
      <stop offset="100%" stop-color="#7B4521"/>
    </linearGradient>
    <linearGradient id="foamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F2E6D5"/>
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#4F2810" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bgGrad4)"/>

  <!-- Saucer Shadow -->
  <ellipse cx="200" cy="335" rx="130" ry="25" fill="#42220B" opacity="0.14"/>

  <!-- Saucer -->
  <g filter="url(#shadow4)">
    <ellipse cx="200" cy="315" rx="130" ry="24" fill="url(#cupGrad)" stroke="#DFD5C6" stroke-width="1.5"/>
    <ellipse cx="200" cy="313" rx="85" ry="14" fill="#E8DEC8" opacity="0.6"/>
  </g>

  <!-- Cup Handle -->
  <path d="M270,205 C330,205 330,270 270,270" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
  <path d="M270,205 C330,205 330,270 270,270" fill="none" stroke="#E5D9C8" stroke-width="4" stroke-linecap="round"/>

  <!-- Ceramic Cup Body -->
  <g filter="url(#shadow4)">
    <path d="M120,180 Q125,300 200,300 Q275,300 280,180 Z" fill="url(#cupGrad)" stroke="#DFD5C6" stroke-width="1.5"/>
    <!-- Cup Rim Ellipse -->
    <ellipse cx="200" cy="180" rx="80" ry="28" fill="#EAE0D2" stroke="#DFD5C6" stroke-width="1.5"/>
    <!-- Coffee surface ring -->
    <ellipse cx="200" cy="180" rx="74" ry="24" fill="url(#coffeeRimGrad)"/>
    <!-- Thick Velvety Foam -->
    <ellipse cx="200" cy="179" rx="66" ry="21" fill="url(#foamGrad)"/>

    <!-- Latte Art - Rosetta / Heart Pattern -->
    <path d="M200,166 C190,154 172,160 178,175 C184,188 200,198 200,198 C200,198 216,188 222,175 C228,160 210,154 200,166 Z" fill="#693B1B"/>
    <path d="M200,168 C193,158 180,163 184,174 C189,183 200,190 200,190 C200,190 211,183 216,174 C220,163 207,158 200,168 Z" fill="#FFFBF5"/>
    <!-- Leaf veins -->
    <line x1="200" y1="162" x2="200" y2="198" stroke="#693B1B" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Cocoa powder sprinkles -->
    <circle cx="160" cy="175" r="1.5" fill="#522B14"/>
    <circle cx="155" cy="182" r="1.2" fill="#522B14"/>
    <circle cx="238" cy="172" r="1.5" fill="#522B14"/>
    <circle cx="244" cy="180" r="1.2" fill="#522B14"/>
  </g>
</svg>

