<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EE"/>
      <stop offset="100%" stop-color="#EEDAC5"/>
    </linearGradient>
    <linearGradient id="coffeeLayer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A2511"/>
      <stop offset="60%" stop-color="#7B431D"/>
      <stop offset="100%" stop-color="#C28C59"/>
    </linearGradient>
    <linearGradient id="milkLayer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C28C59"/>
      <stop offset="35%" stop-color="#F2DEC9"/>
      <stop offset="100%" stop-color="#FFF9F0"/>
    </linearGradient>
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4A2511" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bgGrad)"/>
  
  <!-- Subtle Coffee Beans Pattern in Background -->
  <g opacity="0.07" fill="#4A2511">
    <circle cx="70" cy="80" r="16"/>
    <circle cx="340" cy="110" r="22"/>
    <circle cx="80" cy="320" r="20"/>
    <circle cx="330" cy="310" r="14"/>
  </g>

  <!-- Cup Base Shadow -->
  <ellipse cx="200" cy="335" rx="65" ry="14" fill="#3D1E0B" opacity="0.18"/>

  <!-- Coffee Glass Container -->
  <g filter="url(#shadow)">
    <!-- Glass Outline Body -->
    <path d="M145,110 L158,310 Q160,325 200,325 Q240,325 242,310 L255,110 Z" fill="#FFFFFF" opacity="0.9"/>
    <!-- Condensed Milk Layer (Bottom) -->
    <path d="M155,270 L158,310 Q160,325 200,325 Q240,325 242,310 L245,270 Q200,278 155,270 Z" fill="url(#milkLayer)"/>
    <!-- Coffee Layer (Middle & Top) -->
    <path d="M147,130 L155,270 Q200,278 245,270 L253,130 Q200,138 147,130 Z" fill="url(#coffeeLayer)"/>
    <!-- Swirl Effect in between -->
    <path d="M156,260 Q180,240 200,265 T244,258 L245,270 Q200,278 155,270 Z" fill="#DFC29F" opacity="0.8"/>

    <!-- Ice Cubes floating -->
    <rect x="175" y="145" width="38" height="34" rx="7" transform="rotate(-12 175 145)" fill="#FFFFFF" opacity="0.35" stroke="#FFFFFF" stroke-width="1.5"/>
    <rect x="195" y="175" width="35" height="32" rx="6" transform="rotate(18 195 175)" fill="#FFFFFF" opacity="0.3" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Glass Reflection -->
    <path d="M145,110 L158,310 Q160,325 200,325 Q240,325 242,310 L255,110 Z" fill="url(#glassReflection)"/>

    <!-- Glass Rim -->
    <ellipse cx="200" cy="112" rx="55" ry="12" fill="#E8DEC8" stroke="#FFFFFF" stroke-width="3"/>
    <ellipse cx="200" cy="112" rx="50" ry="9" fill="#522B14"/>

    <!-- Straw -->
    <path d="M215,60 L205,140 L195,300" stroke="#E26D35" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>
</svg>

