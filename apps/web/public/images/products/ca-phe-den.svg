<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F0E8"/>
      <stop offset="100%" stop-color="#E2D4C3"/>
    </linearGradient>
    <linearGradient id="blackCoffee" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E0E06"/>
      <stop offset="50%" stop-color="#2D150A"/>
      <stop offset="100%" stop-color="#3D1D0D"/>
    </linearGradient>
    <linearGradient id="cremaHead" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A56E3B"/>
      <stop offset="100%" stop-color="#6F441D"/>
    </linearGradient>
    <linearGradient id="glassReflection2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#261206" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bgGrad2)"/>
  
  <g opacity="0.06" fill="#1E0E06">
    <circle cx="80" cy="90" r="18"/>
    <circle cx="320" cy="80" r="14"/>
    <circle cx="70" cy="300" r="22"/>
    <circle cx="330" cy="310" r="16"/>
  </g>

  <!-- Cup Base Shadow -->
  <ellipse cx="200" cy="335" rx="65" ry="14" fill="#1E0E06" opacity="0.2"/>

  <!-- Glass container -->
  <g filter="url(#shadow2)">
    <!-- Base Glass -->
    <path d="M145,110 L158,310 Q160,325 200,325 Q240,325 242,310 L255,110 Z" fill="#FFFFFF" opacity="0.95"/>
    
    <!-- Rich Black Coffee Body -->
    <path d="M147,135 L158,310 Q160,325 200,325 Q240,325 242,310 L253,135 Q200,143 147,135 Z" fill="url(#blackCoffee)"/>

    <!-- Crema top froth layer -->
    <ellipse cx="200" cy="135" rx="53" ry="10" fill="url(#cremaHead)"/>

    <!-- Clear Ice Cubes with Refraction -->
    <rect x="170" y="150" width="40" height="36" rx="8" transform="rotate(-8 170 150)" fill="#FFFFFF" opacity="0.4" stroke="#FFFFFF" stroke-width="1.5"/>
    <rect x="195" y="185" width="36" height="34" rx="7" transform="rotate(15 195 185)" fill="#FFFFFF" opacity="0.32" stroke="#FFFFFF" stroke-width="1.5"/>
    <rect x="165" y="225" width="34" height="32" rx="6" transform="rotate(-5 165 225)" fill="#FFFFFF" opacity="0.25" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Glass Reflection Highlights -->
    <path d="M145,110 L158,310 Q160,325 200,325 Q240,325 242,310 L255,110 Z" fill="url(#glassReflection2)"/>

    <!-- Glass Rim -->
    <ellipse cx="200" cy="112" rx="55" ry="12" fill="#E8DEC8" stroke="#FFFFFF" stroke-width="3"/>
    <ellipse cx="200" cy="112" rx="50" ry="9" fill="#2E1609"/>

    <!-- Dark Straw -->
    <path d="M220,60 L210,135 L198,300" stroke="#4A2511" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.85"/>
  </g>
</svg>

