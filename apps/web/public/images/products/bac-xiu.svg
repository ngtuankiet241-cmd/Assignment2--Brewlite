<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF8F2"/>
      <stop offset="100%" stop-color="#F2E3D0"/>
    </linearGradient>
    <linearGradient id="layerMilkCondensed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD8"/>
      <stop offset="100%" stop-color="#F5DEBE"/>
    </linearGradient>
    <linearGradient id="layerFreshMilk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAD5BE"/>
      <stop offset="30%" stop-color="#FAF4EB"/>
      <stop offset="100%" stop-color="#FFFDF9"/>
    </linearGradient>
    <linearGradient id="layerTopCoffee" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F2712"/>
      <stop offset="70%" stop-color="#7D4721"/>
      <stop offset="100%" stop-color="#A86E3C"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#5C3417" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bgGrad3)"/>

  <g opacity="0.06" fill="#693714">
    <circle cx="65" cy="75" r="16"/>
    <circle cx="330" cy="120" r="24"/>
    <circle cx="85" cy="330" r="18"/>
  </g>

  <!-- Cup Base Shadow -->
  <ellipse cx="200" cy="335" rx="65" ry="14" fill="#47230D" opacity="0.16"/>

  <g filter="url(#shadow3)">
    <!-- Glass body -->
    <path d="M145,110 L158,310 Q160,325 200,325 Q240,325 242,310 L255,110 Z" fill="#FFFFFF" opacity="0.95"/>

    <!-- Bottom Layer: Condensed milk -->
    <path d="M155,275 L158,310 Q160,325 200,325 Q240,325 242,310 L245,275 Q200,282 155,275 Z" fill="url(#layerMilkCondensed)"/>

    <!-- Middle Layer: Fresh Milk -->
    <path d="M150,185 L155,275 Q200,282 245,275 L250,185 Q200,192 150,185 Z" fill="url(#layerFreshMilk)"/>

    <!-- Top Layer: Brewed Coffee drizzle -->
    <path d="M147,135 L150,185 Q200,192 250,185 L253,135 Q200,143 147,135 Z" fill="url(#layerTopCoffee)"/>

    <!-- Soft swirl transition between coffee and milk -->
    <path d="M149,180 Q175,200 200,183 T251,180 L250,185 Q200,192 150,185 Z" fill="#B37A47" opacity="0.75"/>

    <!-- Ice Cubes -->
    <rect x="175" y="150" width="38" height="34" rx="8" transform="rotate(-15 175 150)" fill="#FFFFFF" opacity="0.4" stroke="#FFFFFF" stroke-width="1.5"/>
    <rect x="195" y="180" width="36" height="34" rx="7" transform="rotate(12 195 180)" fill="#FFFFFF" opacity="0.3" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Glass Reflection -->
    <path d="M145,110 L158,310 Q160,325 200,325 Q240,325 242,310 L255,110 Z" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>

    <!-- Glass Rim -->
    <ellipse cx="200" cy="112" rx="55" ry="12" fill="#E8DEC8" stroke="#FFFFFF" stroke-width="3"/>
    <ellipse cx="200" cy="112" rx="50" ry="9" fill="#5E3113"/>

    <!-- Aesthetic Straw -->
    <path d="M215,55 L205,130 L195,305" stroke="#D97706" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>
</svg>

