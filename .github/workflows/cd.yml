name: Continuous Delivery & Deployment (CD)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-cd
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------
  # STAGE 1: QUALITY GATE (Lint, Test, Build)
  # -------------------------------------------------------------
  quality-gate-backend:
    name: 1. Quality Gate - Backend API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run Linter & Type-check
        run: npm run lint

      - name: Run Unit Tests
        run: npm test -- --runInBand

      - name: Build Application
        run: npm run build

  quality-gate-frontend:
    name: 1. Quality Gate - Frontend Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Unit & Component Tests
        run: npm test

      - name: Test deployment API handling
        working-directory: .
        run: node --test tests/cd-deploy.test.mjs

      - name: Build Next.js Application
        run: npm run build

  # -------------------------------------------------------------
  # STAGE 2 & 3: DOCKER IMAGE BUILD & REGISTRY PUSH
  # -------------------------------------------------------------
  docker-packaging:
    name: 2 & 3. Build & Tag Docker Images
    needs: [quality-gate-backend, quality-gate-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker (Backend)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for Docker (Frontend)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Backend API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Build & Push Frontend Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

  # -------------------------------------------------------------
  # STAGE 4: PRODUCTION CONFIGURATION AND DATABASE MIGRATION
  # -------------------------------------------------------------
  safe-database-migration:
    name: 4. Validate configuration and migrate production database
    needs: [docker-packaging]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate production configuration
        working-directory: .
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          PRODUCTION_WEB_URL: https://assignment2-brewlite.vercel.app
          PRODUCTION_API_URL: https://brewlite-assignment2-api.onrender.com
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production deployments must run from main."
            exit 1
          fi
          node .github/scripts/deploy.mjs --check
          LATEST_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::This run is not the latest main commit; run CD for the latest commit."
            exit 1
          fi

      - name: Install Prisma CLI
        run: npm ci

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          npx prisma migrate deploy

  # -------------------------------------------------------------
  # STAGE 5: DEPLOY AND VERIFY THE REQUESTED COMMIT
  # -------------------------------------------------------------
  deploy-to-production:
    name: 5. Deploy and verify Render and Vercel
    needs: [safe-database-migration]
    runs-on: ubuntu-latest
    timeout-minutes: 65

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy exact commit and wait for both providers
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_PROJECT_NAME: ${{ vars.VERCEL_PROJECT_NAME }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          PRODUCTION_WEB_URL: https://assignment2-brewlite.vercel.app
          PRODUCTION_API_URL: https://brewlite-assignment2-api.onrender.com
        run: node .github/scripts/deploy.mjs

  # -------------------------------------------------------------
  # STAGE 6: SMOKE TEST & HEALTH CHECK AFTER DEPLOYMENT
  # -------------------------------------------------------------
  smoke-test:
    name: 6. Post-Deployment Smoke Test & Health Check
    needs: [deploy-to-production]
    runs-on: ubuntu-latest

    steps:
      - name: Verify backend, frontend and product endpoints
        run: |
          for url in \
            https://brewlite-assignment2-api.onrender.com/health \
            https://brewlite-assignment2-api.onrender.com/products \
            https://assignment2-brewlite.vercel.app/ \
            https://assignment2-brewlite.vercel.app/api/products; do
            status=$(curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors --max-time 30 --output /dev/null --write-out '%{http_code}' "$url")
            if [ "$status" != "200" ]; then
              echo "::error::$url returned HTTP $status, expected 200."
              exit 1
            fi
            echo "$url returned HTTP 200."
          done

