name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend API CI (Install, Lint, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: 1. Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: 2. Run Linter & Type-check
        run: npm run lint

      - name: 3. Run Unit Tests
        run: npm test -- --runInBand

      - name: 4. Build Backend Application
        run: npm run build

  frontend-ci:
    name: Frontend Web CI (Install, Lint, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: 1. Install dependencies
        run: npm ci

      - name: 2. Run Linter
        run: npm run lint

      - name: 3. Run Unit & Component Tests
        run: npm test

      - name: 4. Build Next.js Application
        run: npm run build
